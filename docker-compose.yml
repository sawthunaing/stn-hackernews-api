services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      Caching__Provider: Redis
      Caching__RedisConnectionString: redis:6379,abortConnect=false
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
